name: 🏛️ Dashboard CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  # ===============================
  # Quality Assurance & Testing
  # ===============================
  test:
    name: 🧪 Quality Assurance
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: 🔍 File Integrity Check (2024 & 2025)
      run: |
        python3 server.py --check-only
        python3 server_2025.py --check-only
        
    - name: ⚡ Performance Optimization Test
      run: |
        python3 optimize.py
        
    - name: 📊 Bundle Size Analysis
      run: |
        echo "📈 Original Bundle Sizes:"
        du -h *.html js/*.js css/*.css | sort -h
        echo "📉 Compressed Bundle Sizes:"
        du -h *.gz js/*.gz css/*.gz 2>/dev/null | sort -h || echo "No compressed files found"
        
    - name: 🌐 Server Startup Test (2024 & 2025)
      run: |
        # Avvio Edizione 2024
        python3 server.py --no-browser -p 8000 &
        PID_2024=$!
        sleep 3
        curl -f http://localhost:8000/index.html || exit 1
        kill $PID_2024 || true
        
        # Avvio Edizione 2025
        python3 server_2025.py --no-browser -p 8001 &
        PID_2025=$!
        sleep 3
        curl -f http://localhost:8001/index_2025.html || exit 1
        kill $PID_2025 || true
        echo "✅ Server startup test successful for both editions"

  # ===============================
  # Cross-Platform Testing
  # ===============================
  cross-platform-test:
    name: 🖥️ Cross-Platform Testing (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
        
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: 🔍 File Integrity Check
      shell: bash
      run: |
        python server.py --check-only
        python server_2025.py --check-only

  # ===============================
  # Security & Code Quality
  # ===============================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      
    - name: 📋 Check for Sensitive Data
      run: |
        echo "🔍 Scanning for potential sensitive data..."
        if grep -E -r -i -I "password\s*=\|secret\s*=\|token\s*=\|api_key\s*=" js/ server*.py; then
          echo "⚠️ Potential sensitive data found. Please review."
          exit 1
        else
          echo "✅ No obvious sensitive credentials found"
        fi

  # ===============================
  # Documentation Check
  # ===============================
  docs-check:
    name: 📚 Documentation Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      
    - name: 📖 Validate README
      run: |
        if [[ -f "README.md" && -s "README.md" ]]; then
          echo "✅ README.md exists and is not empty"
          if grep -q "2024" README.md && grep -q "2025" README.md; then
            echo "✅ README documents both 2024 and 2025 editions"
          else
            echo "⚠️ README might be missing edition references"
          fi
        else
          echo "❌ README.md is missing or empty"
          exit 1
        fi
        
    - name: 📋 Validate QUICKSTART
      run: |
        if [[ -f "QUICKSTART.md" && -s "QUICKSTART.md" ]]; then
          echo "✅ QUICKSTART.md exists"
        else
          echo "❌ QUICKSTART.md is missing"
          exit 1
        fi

    - name: 📜 Validate LICENSE
      run: |
        if [[ -f "LICENSE" && -s "LICENSE" ]]; then
          echo "✅ LICENSE file exists"
        else
          echo "❌ LICENSE file is missing"
          exit 1
        fi

  # ===============================
  # Performance Benchmark
  # ===============================
  performance-benchmark:
    name: ⚡ Performance Benchmark
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: ⚡ Run Performance Tests
      run: |
        echo "📊 Running performance optimization..."
        python3 optimize.py
        
        echo "📈 Verifying compression ratio:"
        python3 -c "import os; files=['index.html','index_2025.html','js/data.js','js/main.js','js/data_2025.js','js/main_2025.js','css/style.css']; orig=sum(os.path.getsize(f) for f in files); comp=sum(os.path.getsize(f+'.gz') for f in files if os.path.exists(f+'.gz')); ratio=(orig-comp)/orig*100; print(f'Ratio: {ratio:.1f}%'); assert ratio >= 70, 'Compression below 70%'"
        echo "✅ Performance gate passed"
        
    - name: 📊 Create Performance Report
      run: |
        echo "# 📊 Performance Report" > performance-report.md
        echo "Generated on: $(date)" >> performance-report.md
        echo "" >> performance-report.md
        echo "## Bundle Sizes" >> performance-report.md
        echo '```' >> performance-report.md
        du -h index*.html js/*.js css/*.css >> performance-report.md
        echo '```' >> performance-report.md
        echo "" >> performance-report.md
        echo "## Compressed Sizes" >> performance-report.md
        echo '```' >> performance-report.md
        du -h *.gz js/*.gz css/*.gz 2>/dev/null >> performance-report.md || echo "No compressed files" >> performance-report.md
        echo '```' >> performance-report.md
        
    - name: 📤 Upload Performance Report
      uses: actions/upload-artifact@v4
      with:
        name: performance-report
        path: performance-report.md

  # ===============================
  # Deployment Artifact
  # ===============================
  deploy-staging:
    name: 🚀 Deploy Staging Artifact
    runs-on: ubuntu-latest
    needs: [test, cross-platform-test, security-scan, docs-check, performance-benchmark]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      
    - name: 🏗️ Prepare Deployment
      run: |
        echo "🏗️ Preparing deployment package..."
        python3 optimize.py
        mkdir -p deploy
        cp -r index*.html js css dashboard dashboard_2025 server*.py *.md *.gz deploy/ 2>/dev/null || true
        echo "✅ Deployment package ready"
        
    - name: 📦 Create Deployment Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dashboard-deployment-${{ github.sha }}
        path: deploy/
        retention-days: 30

  # ===============================
  # Notification
  # ===============================
  notification:
    name: 📢 Build Notification
    runs-on: ubuntu-latest
    needs: [test, cross-platform-test, security-scan, docs-check, performance-benchmark]
    if: always()
    
    steps:
    - name: 📊 Build Summary
      run: |
        echo "🏛️ Dashboard Socio-Economica Build Summary"
        echo "============================================"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"
        echo "Event: ${{ github.event_name }}"
        echo "============================================"
        
        if [ "${{ needs.test.result }}" == "success" ] && \
           [ "${{ needs.cross-platform-test.result }}" == "success" ] && \
           [ "${{ needs.security-scan.result }}" == "success" ] && \
           [ "${{ needs.docs-check.result }}" == "success" ] && \
           [ "${{ needs.performance-benchmark.result }}" == "success" ]; then
          echo "✅ All checks passed! Dashboard is ready for deployment."
        else
          echo "❌ Some checks failed. Please review the build logs."
          echo "Test: ${{ needs.test.result }}"
          echo "Cross-platform: ${{ needs.cross-platform-test.result }}"
          echo "Security: ${{ needs.security-scan.result }}"
          echo "Docs: ${{ needs.docs-check.result }}"
          echo "Performance: ${{ needs.performance-benchmark.result }}"
          exit 1
        fi
